# git-cliff configuration: release notes from gitmoji + Conventional Commits (ADR-0005, docs/release.md).
# Preview the next release locally with: uvx git-cliff --unreleased

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Drop the leading gitmoji (Unicode or :shortcode:) so the parser sees "type(scope): subject".
commit_preprocessors = [
  { pattern = '^(?:\p{Extended_Pictographic}(?:\x{FE0F}|\x{200D}\p{Extended_Pictographic})*|:[a-z0-9_+-]+:)\s+', replace = "" },
]
# The HTML comments only order the groups; they are stripped from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build and CI" },
  { message = "^chore\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^(chore|test|style|revert)", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

name: 🔧 Task / chore
description: Technical work that is not user-facing (refactor, tooling, CI, docs).
labels: ["type: chore", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] …"
    validations:
      required: true

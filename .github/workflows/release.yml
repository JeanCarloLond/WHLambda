name: Release

# Pushing a tag such as v0.2.0 (or v0.2.0-beta.1, published as a pre-release) builds a signed Android APK and AAB,
# the MSI on Windows and the DEB and RPM on Linux, writes the release notes from the commits since the last tag and
# publishes them as a GitHub Release. Setup and secrets: docs/release.md.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android (signed APK and AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is missing, see docs/release.md"; exit 1; }
          done

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew :apps:android:assembleRelease :apps:android:bundleRelease -PappVersion="${GITHUB_REF_NAME#v}"
          rm "$ANDROID_KEYSTORE_FILE"

      - name: Verify the signature and name the files
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk=$(ls apps/android/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/waveheaven-lambda-$version.apk"
          cp apps/android/build/outputs/bundle/release/*.aab "dist/waveheaven-lambda-$version.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: ":apps:desktop:packageDeb :apps:desktop:packageRpm"
          - os: windows-latest
            tasks: ":apps:desktop:packageMsi"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build installers
        run: ./gradlew ${{ matrix.tasks }} -PappVersion="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/build/compose/binaries/main/deb/*
            apps/desktop/build/compose/binaries/main/rpm/*
            apps/desktop/build/compose/binaries/main/msi/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release notes from the commits since the last tag
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
